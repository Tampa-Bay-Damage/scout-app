<script>

const DAYS=["Fri","Sat","Sun"];
const PTS=15;
const TABS=[{id:"stats",label:"Stats",day:"stats"},{id:"rosters",label:"Rosters",day:"rosters"}];
DAYS.forEach(d=>{for(let s=1;s<=10;s++) TABS.push({id:`${d.toLowerCase()}-set${s}`,label:`${d} Set ${s}`,day:d.toLowerCase()});});

function getSession(){return new URLSearchParams(window.location.search).get('session')||'nxl-2026-event1';}
const SESSION=getSession();
document.getElementById('sesslbl').textContent=SESSION;

let db=null,activeTab='stats',data={};
const panelBuilt={};
const panelDirty={};

try{firebase.initializeApp(FB);db=firebase.database();}
catch(e){console.error('Firebase init error:',e);alert('Firebase: '+e.message);}

buildTabs();

// ── TABS ─────────────────────────────────────
function buildTabs(){
  const bar=document.getElementById('tabbar');bar.innerHTML='';
  TABS.forEach(t=>{
    const el=document.createElement('div');
    el.className=`tab ${t.day} ${t.id==='stats'?'stats-tab':''}`;
    el.textContent=t.label;el.id='tab-'+t.id;
    el.onclick=()=>showTab(t.id);bar.appendChild(el);
  });
}

// Pre-create all panel containers — content filled lazily
function createPanels(){
  const wrap=document.getElementById('sheetwrap');
  TABS.forEach(t=>{
    const panel=document.createElement('div');
    panel.className='tab-panel';
    panel.id='panel-'+t.id;
    wrap.appendChild(panel);
  });
}

function showTab(id){
  // Update tab bar highlight
  TABS.forEach(t=>{
    const e=document.getElementById('tab-'+t.id);
    if(e) e.classList.toggle('active',t.id===id);
  });
  // Hide old panel, show new one
  if(activeTab!==id){
    const oldPanel=document.getElementById('panel-'+activeTab);
    if(oldPanel) oldPanel.classList.remove('active');
  }
  activeTab=id;
  const panel=document.getElementById('panel-'+id);
  if(panel) panel.classList.add('active');

  // Always build if never built; re-render if data changed
  if(!panelBuilt[id]){
    initTab(id);
    renderIntoPanel(id);
    panelBuilt[id]=true;
    panelDirty[id]=false;
  } else if(panelDirty[id]){
    renderIntoPanel(id);
    panelDirty[id]=false;
  }
  updateScoreBar();
}

// ── FIREBASE ─────────────────────────────────
function listenFirebase(){
  db.ref(`sessions/${SESSION}`).on('value',snap=>{
    const d=snap.val()||{};
    TABS.forEach(t=>{
      if(t.id==='stats'||t.id==='rosters') return;
      if(d[t.id]){
        data[t.id]=normalizeTab(JSON.parse(JSON.stringify(d[t.id])));
      } else {
        initTab(t.id);
        saveTab(t.id); // write blank data to Firebase so it persists
      }
      panelDirty[t.id]=true;
    });
    // Always mark stats dirty so it rebuilds next visit
    panelBuilt['stats']=false;
    // Re-render active tab with latest data — but not if popup is open
    if(!popCell){
      panelBuilt[activeTab]=false;
      showTab(activeTab);
    } else if(activeTab==='stats'){
      // Always refresh stats even if popup open (stats has no popup)
      renderIntoPanel('stats');
    }
    updateScoreBar();
    document.getElementById('sst').textContent='Live \u2014 Synced';
  });
}

function initTab(id){
  if(data[id]) return;
  data[id]={
    m1:{t1name:'',t2name:'',t1pts:blankPts(),t2pts:blankPts()},
    m2:{t1name:'',t2name:'',t1pts:blankPts(),t2pts:blankPts()}
  };
}

// Migrate legacy move format to current format
function migrateMv(mv){
  if(!mv) return mv;
  // Legacy: sym 'O' or starting with 'O' = death
  if(mv.sym&&mv.sym.startsWith('O')&&!mv.isDead){
    return {...mv, isDead:true, sym:mv.sym.replace(/^O/,'')};
  }
  return mv;
}

// Normalize a point object to ensure all bunkers are arrays
function normalizePt(pt){
  const out={wl:pt.wl||'',rb:pt.rb||'',time:pt.time||'',notes:pt.notes||''};
  BKS.forEach(b=>{
    const val=pt[b];
    if(!val||val==='') out[b]=[];
    else if(typeof val==='string') out[b]=[migrateMv({sym:val,order:'primary',pen:'none'})]; // legacy string format
    else if(Array.isArray(val)) out[b]=val.map(mv=>migrateMv(mv));
    else if(typeof val==='object'){
      // Firebase converts arrays to objects with numeric keys {0:{...},1:{...}}
      out[b]=Object.values(val).map(mv=>migrateMv(mv));
    }
    else out[b]=[];
  });
  return out;
}

function normalizeTab(tabData){
  if(!tabData) return null;
  ['m1','m2'].forEach(mk=>{
    if(!tabData[mk]) return;
    ['t1pts','t2pts'].forEach(tk=>{
      if(!tabData[mk][tk]) return;
      tabData[mk][tk]=tabData[mk][tk].map(pt=>normalizePt(pt));
    });
  });
  return tabData;
}

function blankPts(){
  return Array.from({length:PTS},()=>{
    const p={wl:'',rb:'',time:'',notes:''};
    BKS.forEach(b=>p[b]=[]);
    return p;
  });
}

function getSeqGroups(pt){
  // Returns a map of bunkername -> group number (1-based)
  // Group = set of bunkers linked by primary->secondary->tertiary relationships
  // We scan all bunkers: primary moves start new groups, secondary/tertiary inherit
  const groups={};
  let groupNum=0;
  BKS.forEach(b=>{
    const moves=pt[b]||[];
    const primary=moves.find(m=>m.order==='primary');
    if(primary){
      groupNum++;
      groups[b]=groupNum;
    }
  });
  // Secondary/tertiary: find which group they belong to by looking at which primary
  // tapped them. Since secondary stores its own bk, we need to find the primary
  // that caused it. We reconstruct this from applyMove logic:
  // each popMoves set shares a group. We store groupId on the move object.
  // For now use order of appearance as fallback.
  BKS.forEach(b=>{
    const moves=pt[b]||[];
    const nonPrimary=moves.find(m=>m.order!=='primary');
    if(nonPrimary&&!groups[b]){
      // assign to group of move's groupId if stored, else 1
      groups[b]=nonPrimary.groupId||1;
    }
  });
  return groups;
}

function renderBkCell(td,moves){
  td.innerHTML='';
  // Preserve shade class, only remove mv- classes
  td.className=td.className.replace(/\s*mv-\w+/g,'');
  td.style.background='';
  td.style.padding='0 2px';
  td.style.display='';
  if(!moves||moves.length===0) return;  // let CSS class handle empty cell bg
  const realMoves=moves.filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_'));
  if(realMoves.length===0) return;

  const orderColor={primary:'#c8e6c9',secondary:'#ffe0b2',tertiary:'#bbdefb'};
  // Death overrides color to red
  if(realMoves.length===1&&realMoves[0].isDead){
    td.style.background='#ef9a9a';td.style.textAlign='center';td.style.verticalAlign='middle';td.style.padding='0 2px';
    const mv=realMoves[0];
    if(mv.sym){
      const span=document.createElement('span');
      let txt=mv.sym;
      if(mv.pen&&mv.pen!=='none') txt+='°'+mv.pen;
      span.style.cssText='color:#000;font-weight:bold';
      span.textContent=txt;
      td.appendChild(span);
      if(mv.seqNum){const sup=document.createElement('sup');sup.textContent=mv.seqNum;sup.style.color='#000';td.appendChild(sup);}
    }
    return;
  }

  if(realMoves.length===1){
    // Single move — full cell color, centered
    td.style.background=orderColor[realMoves[0].order]||'#eee';
    td.style.textAlign='center';
    td.style.verticalAlign='middle';
    td.style.padding='0 2px';
    const span=document.createElement('span');
    let txt=realMoves[0].sym;
    if(realMoves[0].pen&&realMoves[0].pen!=='none') txt+='°'+realMoves[0].pen;
    span.style.cssText='color:#000;font-weight:bold';
    span.textContent=txt;
    td.appendChild(span);
    if(realMoves[0].seqNum){
      const sup=document.createElement('sup');sup.textContent=realMoves[0].seqNum;sup.style.color='#000';td.appendChild(sup);
    }
  } else {
    // Multiple moves — split vertically
    td.style.display='flex';
    td.style.height='100%';
    td.style.minHeight='22px';
    realMoves.forEach(mv=>{
      const half=document.createElement('div');
      const bg=mv.isDead?'#ef9a9a':(orderColor[mv.order]||'#eee');
      half.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;background:'+bg+';padding:0 2px';
      let txt=mv.sym||'';
      if(mv.pen&&mv.pen!=='none') txt+='°'+mv.pen;
      half.style.color='#000';
      half.style.fontWeight='bold';
      half.style.fontSize='11px';
      half.textContent=txt;
      if(mv.seqNum){
        const sup=document.createElement('sup');sup.textContent=mv.seqNum;sup.style.color='#000';half.appendChild(sup);
      }
      td.appendChild(half);
    });
  }
}

  // Clear button
  // Player roster buttons
  if(popCell){
    const{tabId,mk,tk}=popCell;
    const teamName=data[tabId][mk][tk==='t1pts'?'t1name':'t2name'];
    const teamKey=teamName?(teamName.replace(/\s+/g,'_').toLowerCase()):null;
    const players=(teamKey&&window._rosterData&&window._rosterData[teamKey])||[];
    const activePlayers=players.filter(p=>p.name||p.num);
    if(activePlayers.length>0){
      const rosterLbl=document.createElement('div');
      rosterLbl.style.cssText='font-size:10px;font-weight:bold;color:#555;margin:6px 0 3px';
      rosterLbl.textContent='Player:';
      cont.appendChild(rosterLbl);
      const rosterGrid=document.createElement('div');
      rosterGrid.style.cssText='display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px';
      activePlayers.forEach(p=>{
        const lastName=p.name.split(' ').pop();
        const label=p.num?('#'+p.num+' '+lastName):lastName;
        const btn=document.createElement('button');
        btn.style.cssText='height:28px;width:100%;border:2px solid #ccc;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer;background:#fff;font-family:Arial,sans-serif;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        btn.textContent=label;
        btn.title=p.name;
        // Store num and initials directly on button for easy retrieval
        btn.dataset.playerNum=p.num||'';
        btn.dataset.playerInitials=p.name.split(' ').map(w=>w[0]).join('').toUpperCase();
        if(window._selPlayer&&window._selPlayer.label===label){btn.style.borderColor='#1565c0';btn.style.background='#e3f2fd';}
        btn.onclick=()=>{
          rosterGrid.querySelectorAll('button').forEach(b=>{b.style.borderColor='#ccc';b.style.background='#fff';});
          if(window._selPlayer&&window._selPlayer.label===label){
            window._selPlayer=null;
          } else {
            btn.style.borderColor='#1565c0';btn.style.background='#e3f2fd';
            window._selPlayer={label,num:btn.dataset.playerNum,initials:btn.dataset.playerInitials};
          }
        };
        rosterGrid.appendChild(btn);
      });
      cont.appendChild(rosterGrid);
    }
  }

  const clearBtn=document.createElement('button');
  clearBtn.style.cssText='width:100%;padding:5px;margin-top:6px;border:1px solid #ccc;background:#fff;color:#999;font-size:11px;cursor:pointer;border-radius:3px;font-family:Arial,sans-serif';
  clearBtn.textContent='Clear This Cell';
  clearBtn.onclick=()=>{
    if(!popCell) return;
    const{tabId,mk,tk,idx,bk}=popCell;
    data[tabId][mk][tk][idx][bk]=[];
    saveTab(tabId);
    const panel=document.getElementById('panel-'+tabId);
    if(panel){
      const key=`${tabId}|${mk}|${tk}|${idx}|${bk}`;
      const cell=panel.querySelector(`td[data-bkkey="${CSS.escape(key)}"]`);
      if(cell) renderBkCell(cell,[]);
    }
    closeMove();
  };
  cont.appendChild(clearBtn);
}

window.closeMove=()=>{
  document.getElementById('moveo').classList.remove('open');
  popCell=null;
};

window.applyMove=()=>{
  if(!popCell) return;
  const{tabId,mk,tk,idx,bk}=popCell;
  if(!window._selSym&&!window._selDeath){alert('Please pick a symbol or select Death.');return;}

  if(!data[tabId][mk][tk][idx][bk]) data[tabId][mk][tk][idx][bk]=[];

  // Push new move to array (multiple moves supported)
  const finalSym=(window._selSym||'')+(window._selDeath?'':(window._selMod||''));
  // Derive superscript label from selected player
  let seqNum=null;
  if(window._selPlayer){
    seqNum=window._selPlayer.num||window._selPlayer.initials||null;
  }
  data[tabId][mk][tk][idx][bk].push({
    sym:finalSym,
    isDead:window._selDeath||false,
    player:window._selPlayer||null,
    seqNum,
    order:window._selOrder||'primary',
    pen:window._selPen||'none',
  });

  saveTab(tabId);

  // Reset picker, keep popup open
  window._selSym='';
  window._selMod='';
  window._selDeath=false;
  window._selOrder='primary';
  window._selPen='none';
  window._selPlayer=null;

  // Refresh cell in background without closing popup
  const panel=document.getElementById('panel-'+tabId);
  if(panel){
    const key=`${tabId}|${mk}|${tk}|${idx}|${bk}`;
    const cell=panel.querySelector(`td[data-bkkey="${CSS.escape(key)}"]`);
    if(cell) renderBkCell(cell,data[tabId][mk][tk][idx][bk]);
  }

  // Rebuild popup content to show updated move list
  buildMoveContent();
};

document.getElementById('btn-can').onclick=()=>closeMove();
document.getElementById('btn-app').onclick=()=>applyMove();

function renderRosters(panel){
  panel.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:10px;overflow:auto;height:100%';

  const title=document.createElement('div');
  title.style.cssText='font-size:14px;font-weight:bold;color:#00695c;margin-bottom:10px';
  title.textContent='Team Rosters';
  wrap.appendChild(title);

  // Load roster data from Firebase or local
  const rosterData=window._rosterData||{};

  TEAMS.forEach(team=>{
    const teamKey=team.replace(/\s+/g,'_').toLowerCase();

    // Accordion header
    const hdr=document.createElement('div');
    hdr.style.cssText='background:#e0f2f1;border:1px solid #b2dfdb;border-radius:4px;padding:8px 12px;margin-bottom:4px;cursor:pointer;font-weight:bold;font-size:12px;display:flex;justify-content:space-between;align-items:center;user-select:none';
    hdr.textContent=team;
    const arrow=document.createElement('span');
    arrow.textContent='▶';arrow.style.fontSize='10px';
    hdr.appendChild(arrow);

    // Roster body (hidden by default)
    const body=document.createElement('div');
    body.style.cssText='display:none;border:1px solid #b2dfdb;border-top:none;border-radius:0 0 4px 4px;margin-bottom:6px;padding:6px';

    // Players table
    const tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:6px';

    // Header
    const hrow=document.createElement('tr');
    ['#','Name'].forEach(h=>{
      const th=document.createElement('th');
      th.style.cssText='background:#b2dfdb;padding:4px 8px;font-size:11px;text-align:left;border:1px solid #ccc';
      th.textContent=h;hrow.appendChild(th);
    });
    tbl.appendChild(hrow);

    // Existing players
    const players=rosterData[teamKey]||[];
    // Always show at least 15 rows
    const rowCount=Math.max(players.length+1,15);
    for(let i=0;i<rowCount;i++){
      const p=players[i]||{num:'',name:''};
      const tr=document.createElement('tr');

      const tdNum=document.createElement('td');
      tdNum.style.cssText='border:1px solid #ddd;padding:2px;width:50px';
      const numInp=document.createElement('input');
      numInp.type='text';numInp.value=p.num||'';numInp.placeholder='#';
      numInp.style.cssText='width:100%;border:none;outline:none;font-size:11px;padding:2px 4px;text-align:center';
      numInp.onchange=()=>saveRosterRow(teamKey,i,numInp.value,nameInp.value);
      tdNum.appendChild(numInp);tr.appendChild(tdNum);

      const tdName=document.createElement('td');
      tdName.style.cssText='border:1px solid #ddd;padding:2px';
      const nameInp=document.createElement('input');
      nameInp.type='text';nameInp.value=p.name||'';nameInp.placeholder='Player name...';
      nameInp.style.cssText='width:100%;border:none;outline:none;font-size:11px;padding:2px 4px';
      nameInp.onchange=()=>saveRosterRow(teamKey,i,numInp.value,nameInp.value);
      tdName.appendChild(nameInp);tr.appendChild(tdName);

      tbl.appendChild(tr);
    }
    body.appendChild(tbl);

    // Add row button
    const addBtn=document.createElement('button');
    addBtn.textContent='+ Add Player';
    addBtn.style.cssText='padding:5px 10px;border:1px dashed #00695c;background:#fff;color:#00695c;font-size:11px;cursor:pointer;border-radius:3px;width:100%';
    addBtn.onclick=()=>{
      if(!window._rosterData) window._rosterData={};
      if(!window._rosterData[teamKey]) window._rosterData[teamKey]=[];
      window._rosterData[teamKey].push({num:'',name:''});
      renderRosters(panel);
      // Re-open this team's accordion
      setTimeout(()=>{
        const hdrs=[...panel.querySelectorAll('[data-teamkey]')];
        const h=hdrs.find(x=>x.dataset.teamkey===teamKey);
        if(h) h.click();
      },50);
    };
    body.appendChild(addBtn);

    // Toggle accordion
    hdr.dataset.teamkey=teamKey;
    hdr.onclick=()=>{
      const isOpen=body.style.display!=='none';
      body.style.display=isOpen?'none':'block';
      arrow.textContent=isOpen?'▶':'▼';
    };

    wrap.appendChild(hdr);
    wrap.appendChild(body);
  });

  panel.appendChild(wrap);
}

function saveRosterRow(teamKey,idx,num,name){
  if(!window._rosterData) window._rosterData={};
  if(!window._rosterData[teamKey]) window._rosterData[teamKey]=[];
  window._rosterData[teamKey][idx]={num,name};
  // Save to Firebase
  if(db) db.ref('rosters/'+teamKey).set(window._rosterData[teamKey]);
}

// Load rosters from Firebase on init
function loadRosters(){
  if(!db) return;
  db.ref('rosters').on('value',snap=>{
    const existing=snap.val()||{};
    // Merge preloaded rosters — only fill in teams with no data yet
    let needsWrite=false;
    Object.keys(PRELOADED_ROSTERS).forEach(key=>{
      if(!existing[key]||existing[key].length===0){
        existing[key]=PRELOADED_ROSTERS[key];
        needsWrite=true;
      }
    });
    if(needsWrite) db.ref('rosters').set(existing);
    window._rosterData=existing;
    // Only re-render rosters if the panel hasn't been built yet (don't collapse while editing)
    if(activeTab==='rosters'&&!panelBuilt['rosters']){
      showTab('rosters');
    }
  });
}

// ── STATS ─────────────────────────────────────
function renderStats(panel){
  const div=document.createElement('div');div.className='stats-wrap';
  const bkAll={};
  BKS.forEach(b=>bkAll[b]={runs:0,deaths:0,kills:0,oppRuns:0});
  const teamStats={};
  TEAMS.forEach(t=>{teamStats[t]={};BKS.forEach(b=>teamStats[t][b]={runs:0,deaths:0,kills:0,oppRuns:0});});
  const teamPts={};  // total points played per team
  TEAMS.forEach(t=>{teamPts[t]=0;});
  let totalPtsAll=0;

  TABS.forEach(t=>{
    if(t.id==='stats'||!data[t.id]) return;
    ['m1','m2'].forEach(mk=>{
      const md=data[t.id][mk];
      // Process both teams together so we can cross-reference kills
      const teams=[
        {tk:'t1pts',name:md.t1name,oppTk:'t2pts',oppName:md.t2name},
        {tk:'t2pts',name:md.t2name,oppTk:'t1pts',oppName:md.t1name}
      ];
      teams.forEach(({tk,name,oppTk})=>{
        (md[tk]||[]).forEach((pt,ptIdx)=>{
          const oppPt=(md[oppTk]||[])[ptIdx]||{};
          // Count point as played if any bunker has a move or W/L is set
          const hasData=pt.wl||BKS.some(b=>(pt[b]||[]).length>0);
          if(hasData){
            totalPtsAll++;
            if(name&&teamPts[name]!==undefined) teamPts[name]++;
          }
          BKS.forEach(b=>{
            // Count runs and deaths for this team
            (pt[b]||[]).forEach(mv=>{
              if(mv.isDead||(mv.sym&&mv.sym!=='_')){
                bkAll[b].runs++;
                if(name&&teamStats[name]) teamStats[name][b].runs++;
              }
              if(mv.isDead){
                bkAll[b].deaths++;
                if(name&&teamStats[name]) teamStats[name][b].deaths++;
              }
            });
            // Kills = number of deaths the opponent had in this same bunker this point
            const oppDeaths=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
            if(oppDeaths>0){
              bkAll[b].kills+=oppDeaths;
              if(name&&teamStats[name]) teamStats[name][b].kills+=oppDeaths;
            }
            // Opponent runs at this bunker (denominator for kill %)
            const oppRunCount=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
            if(oppRunCount>0){
              bkAll[b].oppRuns+=oppRunCount;
              if(name&&teamStats[name]) teamStats[name][b].oppRuns+=oppRunCount;
            }
          });
        });
      });
    });
  });

  // Side-by-side layout: event stats left, team stats right
  const statsLayout=document.createElement('div');
  statsLayout.style.cssText='display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap';

  // Event stats
  const eventWrap=document.createElement('div');
  const eventH2=document.createElement('div');
  eventH2.style.cssText='font-size:14px;font-weight:bold;color:#6a1b9a;margin-bottom:8px';
  eventH2.textContent='Event Stats — All Matches';
  eventWrap.appendChild(eventH2);
  eventWrap.appendChild(makeStatsTbl(bkAll, true, totalPtsAll));
  statsLayout.appendChild(eventWrap);

  // Build per-match index for each team: [{tabId,mk,label}]
  const teamMatches={};
  TEAMS.forEach(t=>{teamMatches[t]=[];});
  TABS.forEach(t=>{
    if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
    ['m1','m2'].forEach(mk=>{
      const md=data[t.id][mk];
      // Check both teams in this match
      [{tk:'t1pts',name:md.t1name},{tk:'t2pts',name:md.t2name}].forEach(({tk,name})=>{
        if(!name) return;
        const pts=md[tk]||[];
        const hasData=pts.some(pt=>pt.wl||BKS.some(b=>(pt[b]||[]).length>0));
        if(hasData&&teamMatches[name]){
          teamMatches[name].push({tabId:t.id,mk,tk});
        }
      });
    });
  });

  // Team stats with dropdowns
  const teamWrap=document.createElement('div');
  const teamHdrRow=document.createElement('div');
  teamHdrRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap';

  const teamH2=document.createElement('span');
  teamH2.style.cssText='font-size:14px;font-weight:bold;color:#6a1b9a';
  teamH2.textContent='Team Stats:';

  const teamSel=document.createElement('select');
  teamSel.style.cssText='border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer';
  TEAMS.forEach(t=>{
    const opt=document.createElement('option');opt.value=t;opt.textContent=t;
    teamSel.appendChild(opt);
  });

  const matchSel=document.createElement('select');
  matchSel.style.cssText='border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer';

  teamHdrRow.appendChild(teamH2);
  teamHdrRow.appendChild(teamSel);
  teamHdrRow.appendChild(matchSel);
  teamWrap.appendChild(teamHdrRow);

  const teamTblWrap=document.createElement('div');
  teamWrap.appendChild(teamTblWrap);
  statsLayout.appendChild(teamWrap);
  div.appendChild(statsLayout);
  panel.appendChild(div);

  function calcTeamStats(team, matchIdx){
    // matchIdx = -1 means all matches
    const bk={};
    BKS.forEach(b=>bk[b]={runs:0,deaths:0,kills:0,oppRuns:0});
    let pts=0;
    const matches=matchIdx===-1?teamMatches[team]:[teamMatches[team][matchIdx]].filter(Boolean);
    matches.forEach(({tabId,mk,tk})=>{
      const md=data[tabId][mk];
      const oppTk=tk==='t1pts'?'t2pts':'t1pts';
      (md[tk]||[]).forEach((pt,ptIdx)=>{
        const oppPt=(md[oppTk]||[])[ptIdx]||{};
        const hasData=pt.wl||BKS.some(b=>(pt[b]||[]).length>0);
        if(hasData) pts++;
        BKS.forEach(b=>{
          (pt[b]||[]).forEach(mv=>{
            if(mv.isDead||(mv.sym&&mv.sym!=='_')){bk[b].runs++;}
            if(mv.isDead){bk[b].deaths++;}
          });
          const oppDeaths=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
          bk[b].kills+=oppDeaths;
          const oppRuns=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
          bk[b].oppRuns+=oppRuns;
        });
      });
    });
    return {bk,pts};
  }

  function populateMatchSel(team){

  }

    populateMatchSel(team);
    renderTeamStatsWithMatch(team, -1);
  }

  teamSel.onchange=()=>renderTeamStats(teamSel.value);
  matchSel.onchange=()=>renderTeamStatsWithMatch(teamSel.value, parseInt(matchSel.value));

  // ── PLAYER STATS SECTION ──
  const playerSection=document.createElement('div');

  TEAMS.forEach(t=>{const opt=document.createElement('option');opt.value=t;opt.textContent=t;pTeamSel.appendChild(opt);});

  const pPlayerSel=document.createElement('select');
  pPlayerSel.style.cssText='border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer';

  playerHdrRow.appendChild(document.createTextNode('Team: '));
  playerHdrRow.appendChild(pTeamSel);
  playerHdrRow.appendChild(document.createTextNode('Player: '));
  playerHdrRow.appendChild(pPlayerSel);
  playerSection.appendChild(playerHdrRow);

  const playerTblWrap=document.createElement('div');
  playerSection.appendChild(playerTblWrap);
  div.appendChild(playerSection);

  function calcPlayerStats(team, playerLabel){
    const stats={pointsPlayed:0,pointsDied:0,penalties:{Mi:0,Mj:0},bunkers:{},deaths:{},shootingDir:{}};
    BKS.forEach(b=>{stats.bunkers[b]=0;stats.deaths[b]=0;stats.shootingDir[b]={S:0,'\u2206':0,X:0};});
    TABS.forEach(t=>{
      if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
      ['m1','m2'].forEach(mk=>{
        const md=data[t.id][mk];
        ['t1pts','t2pts'].forEach((tk,ti)=>{
          const tname=ti===0?md.t1name:md.t2name;
          if(tname!==team) return;
          (md[tk]||[]).forEach(pt=>{
            let appeared=false,died=false;
            BKS.forEach(b=>{
              (pt[b]||[]).forEach(mv=>{
                const mvLabel=mv.player&&mv.player.label?mv.player.label:(mv.player||null);
                if(mvLabel!==playerLabel) return;
                appeared=true;
                stats.bunkers[b]++;
                if(mv.isDead){died=true;stats.deaths[b]++;}
                if(mv.pen==='Mi') stats.penalties.Mi++;
                if(mv.pen==='Mj') stats.penalties.Mj++;
                const sym=mv.sym||'';
                if(sym.startsWith('S')) stats.shootingDir[b].S++;
                else if(sym.startsWith('\u2206')) stats.shootingDir[b]['\u2206']++;
                else if(sym.startsWith('X')) stats.shootingDir[b].X++;
              });
            });
            if(appeared){stats.pointsPlayed++;if(died)stats.pointsDied++;}
          });
        });
      });
    });
    return stats;
  }

  function populatePlayerSel(team){
    pPlayerSel.innerHTML='';
    const teamKey=team.replace(/\s+/g,'_').toLowerCase();

      const opt=document.createElement('option');opt.value=label;opt.textContent=displayName;
      pPlayerSel.appendChild(opt);
    });

    const summaryDiv=document.createElement('div');
    summaryDiv.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px';
    [
      {label:'Points Played',val:pp},
      {label:'Points Died Off Break',val:s.pointsDied+' ('+deathPct+')'},
      {label:'Minor Penalties',val:s.penalties.Mi},
      {label:'Major Penalties',val:s.penalties.Mj},
    ].forEach(({label,val})=>{
      const card=document.createElement('div');
      card.style.cssText='background:#f5f5f5;border:1px solid #e0e0e0;border-radius:4px;padding:5px 10px;min-width:120px';
      const lbl=document.createElement('div');lbl.style.cssText='font-size:9px;color:#666';lbl.textContent=label;
      const v=document.createElement('div');v.style.cssText='font-size:14px;font-weight:bold;color:#1a6e1a';v.textContent=val;

    playerTblWrap.appendChild(summaryDiv);

    // Bunker table
    const tbl=document.createElement('table');tbl.className='stats-tbl';
    const hdr=document.createElement('tr');
    ['Bunker','Count','Count %','Death %','Snake %','Dorito %','Dove %'].forEach(h=>{
      const th=document.createElement('th');th.textContent=h;hdr.appendChild(th);
    });
    tbl.appendChild(hdr);
    const totalCount=BKS.reduce((sum,b)=>sum+(s.bunkers[b]||0),0);
    BKS.forEach((b,i)=>{
      const count=s.bunkers[b]||0;
      const countPct=(totalCount>0&&count>0)?(count/totalCount*100).toFixed(1)+'%':'0%';
      const deaths=s.deaths[b]||0;
      const deathPctB=count>0?(deaths/count*100).toFixed(0)+'%':'0%';
      const d=s.shootingDir[b]||{S:0,'\u2206':0,X:0};
      const dirTotal=d.S+d['\u2206']+d.X;
      const sPct=dirTotal>0?(d.S/dirTotal*100).toFixed(0)+'%':'0%';
      const dPct=dirTotal>0?(d['\u2206']/dirTotal*100).toFixed(0)+'%':'0%';
      const xPct=dirTotal>0?(d.X/dirTotal*100).toFixed(0)+'%':'0%';
      const tr=document.createElement('tr');
      [b,count,countPct,deathPctB,sPct,dPct,xPct].forEach(v=>{
        const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    playerTblWrap.appendChild(tbl);
  }

  populatePlayerSel(TEAMS[0]);

  pTeamSel.onchange=()=>{

}

function makeStatsTbl(bkData, killsOnly, totalPts){
  const tbl=document.createElement('table');tbl.className='stats-tbl';
  const hdr=document.createElement('tr');
  const headers=killsOnly
    ?['Bunker','Shape','Bunkers Off Break','Bunker %','Kills Off Break','Kill %']
    :['Bunker','Shape','Bunkers Off Break','Bunker %','Deaths Off Break','Death %','Kills Off Break','Kill %'];
  headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;hdr.appendChild(th);});
  tbl.appendChild(hdr);

  // Pre-calculate totals so Bunker % uses correct denominator
  let allRuns=0,totRuns=0,totDeaths=0,totKills=0,totOppRuns=0;
  BKS.forEach(b=>{
    const s=bkData[b]||{runs:0,deaths:0,kills:0,oppRuns:0};
    allRuns+=s.runs;totDeaths+=s.deaths;totKills+=s.kills;totOppRuns+=s.oppRuns;
  });
  totRuns=allRuns;

  BKS.forEach((b,i)=>{
    const s=bkData[b]||{runs:0,deaths:0,kills:0,oppRuns:0};
    const deathPct=s.runs>0?(s.deaths/s.runs*100).toFixed(0)+'%':'\u2014';
    const killPct=s.oppRuns>0?(s.kills/s.oppRuns*100).toFixed(0)+'%':'\u2014';
    const bunkPct=allRuns>0?(s.runs/allRuns*100).toFixed(1)+'%':'\u2014';
    const tr=document.createElement('tr');
    const vals=killsOnly
      ?[b,SHAPES[i]||'',s.runs,bunkPct,s.kills,killPct]
      :[b,SHAPES[i]||'',s.runs,bunkPct,s.deaths,deathPct,s.kills,killPct];
    vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
    tbl.appendChild(tr);
  });

  const totDeathPct=totRuns>0?(totDeaths/totRuns*100).toFixed(0)+'%':'\u2014';
  const totKillPct=totOppRuns>0?(totKills/totOppRuns*100).toFixed(0)+'%':'\u2014';
  const totTr=document.createElement('tr');totTr.className='tot';
  const totVals=killsOnly
    ?['TOTAL','',totRuns,'100%',totKills,totKillPct]
    :['TOTAL','',totRuns,'100%',totDeaths,totDeathPct,totKills,totKillPct];
  totVals.forEach(v=>{const td=document.createElement('td');td.textContent=v;totTr.appendChild(td);});
  tbl.appendChild(totTr);
  return tbl;

// ── CLAUDE API CALL ────────────────────────────────────────────────
async function callClaude(systemPrompt, userPrompt){
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system: systemPrompt,
      messages:[{role:'user',content:userPrompt}]
    })
  });
  const d=await resp.json();
  return d.content&&d.content[0]?d.content[0].text:'[No response]';
}

function buildEventSummary(){
  const lines=[];
  const bkAll={};
  BKS.forEach(b=>bkAll[b]={runs:0,deaths:0,kills:0,oppRuns:0});
  const teamBkStats={};
  TEAMS.forEach(t=>{teamBkStats[t]={};BKS.forEach(b=>teamBkStats[t][b]={runs:0,deaths:0});});
  let totalPts=0, teamPtsCount={};
  TEAMS.forEach(t=>teamPtsCount[t]=0);

  TABS.forEach(t=>{
    if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
    ['m1','m2'].forEach(mk=>{
      const md=data[t.id][mk];
      [{tk:'t1pts',name:md.t1name,oppTk:'t2pts'},{tk:'t2pts',name:md.t2name,oppTk:'t1pts'}].forEach(({tk,name,oppTk})=>{
        (md[tk]||[]).forEach((pt,pi)=>{
          const oppPt=(md[oppTk]||[])[pi]||{};
          const hasData=pt.wl||BKS.some(b=>(pt[b]||[]).length>0);
          if(hasData){totalPts++;if(name&&teamPtsCount[name]!==undefined)teamPtsCount[name]++;}
          BKS.forEach(b=>{
            (pt[b]||[]).forEach(mv=>{
              if(mv.isDead||(mv.sym&&mv.sym!=='_')){bkAll[b].runs++;if(name)teamBkStats[name][b].runs++;}
              if(mv.isDead){bkAll[b].deaths++;if(name)teamBkStats[name][b].deaths++;}
            });
            const oppDeaths=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
            bkAll[b].kills+=oppDeaths;
            bkAll[b].oppRuns+=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
          });
        });
      });
    });
  });

  const allRuns=BKS.reduce((s,b)=>s+bkAll[b].runs,0);
  lines.push(`EVENT: ${SESSION} | Total points scouted: ${totalPts}`);
  lines.push('\nBUNKER BREAKDOWN (all teams):');
  BKS.forEach(b=>{
    const s=bkAll[b];
    if(s.runs===0) return;
    const pct=allRuns>0?(s.runs/allRuns*100).toFixed(1):'0';
    const dPct=s.runs>0?(s.deaths/s.runs*100).toFixed(0):'0';
    const kPct=s.oppRuns>0?(s.kills/s.oppRuns*100).toFixed(0):'0';
    lines.push(`  ${b}: ${s.runs} runs (${pct}%), death ${dPct}%, kill ${kPct}%`);
  });

  lines.push('\nTEAM ACTIVITY (points scouted):');
  TEAMS.forEach(t=>{
    if(teamPtsCount[t]>0){
      const topBks=BKS.filter(b=>teamBkStats[t][b].runs>0).sort((a,b2)=>teamBkStats[t][b2].runs-teamBkStats[t][a].runs).slice(0,5);
      lines.push(`  ${t} (${teamPtsCount[t]} pts): top bunkers — ${topBks.map(b=>b+'×'+teamBkStats[t][b].runs).join(', ')}`);
    }
  });

  return lines.join('\n');
}

function buildTeamSummary(teamName){
  const bk={};BKS.forEach(b=>bk[b]={runs:0,deaths:0,kills:0,oppRuns:0});
  let pts=0,wPts=0,lPts=0,redW=0,redL=0,blueW=0,blueL=0,majPen=0,minPen=0;

  TABS.forEach(t=>{
    if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
    ['m1','m2'].forEach(mk=>{
      const md=data[t.id][mk];
      [{tk:'t1pts',name:md.t1name,oppTk:'t2pts'},{tk:'t2pts',name:md.t2name,oppTk:'t1pts'}].forEach(({tk,name,oppTk})=>{
        if(name!==teamName) return;
        (md[tk]||[]).forEach((pt,pi)=>{
          const oppPt=(md[oppTk]||[])[pi]||{};
          const hasData=pt.wl||BKS.some(b=>(pt[b]||[]).length>0);
          if(hasData){
            pts++;
            if(pt.wl==='W'){wPts++;if(pt.rb==='Red')redW++;else blueW++;}
            else if(pt.wl==='L'){lPts++;if(pt.rb==='Red')redL++;else blueL++;}
          }
          BKS.forEach(b=>{
            (pt[b]||[]).forEach(mv=>{
              if(mv.isDead||(mv.sym&&mv.sym!=='_')) bk[b].runs++;
              if(mv.isDead) bk[b].deaths++;
              if(mv.pen==='Mj') majPen++;
              if(mv.pen==='Mi') minPen++;
            });
            bk[b].kills+=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
            bk[b].oppRuns+=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
          });
        });
      });
    });
  });

  const allRuns=BKS.reduce((s,b)=>s+bk[b].runs,0);
  const lines=[`TEAM: ${teamName} | Points: ${pts} (${wPts}W-${lPts}L)`];
  lines.push(`Side stats: Red ${redW}W-${redL}L | Blue ${blueW}W-${blueL}L`);
  lines.push(`Penalties: ${majPen} Major, ${minPen} Minor`);
  lines.push('\nBunker breakdown:');
  BKS.forEach(b=>{
    if(bk[b].runs===0) return;
    const pct=allRuns>0?(bk[b].runs/allRuns*100).toFixed(1):'0';
    const dPct=bk[b].runs>0?(bk[b].deaths/bk[b].runs*100).toFixed(0):'0';
    const kPct=bk[b].oppRuns>0?(bk[b].kills/bk[b].oppRuns*100).toFixed(0):'0';
    lines.push(`  ${b}: ${bk[b].runs} runs (${pct}%), death ${dPct}%, kill ${kPct}%`);
  });
  return lines.join('\n');
}

function buildPlayerSummary(teamName, playerLabel){
  // reuse calcPlayerStats from renderStats
  const s=calcPlayerStats(teamName, playerLabel);
  const pp=s.pointsPlayed;
  const lines=[`PLAYER: ${playerLabel} | Team: ${teamName} | Points played: ${pp}`];
  lines.push(`Deaths off break: ${s.pointsDied} (${pp>0?(s.pointsDied/pp*100).toFixed(0):0}%)`);
  lines.push(`Penalties: ${s.penalties.Mj} Major, ${s.penalties.Mi} Minor`);
  const totalCount=BKS.reduce((sum,b)=>sum+(s.bunkers[b]||0),0);
  lines.push('\nBunker breakdown:');
  BKS.forEach(b=>{
    if(!s.bunkers[b]) return;
    const pct=totalCount>0?(s.bunkers[b]/totalCount*100).toFixed(1):'0';
    const dPct=s.bunkers[b]>0?(s.deaths[b]/s.bunkers[b]*100).toFixed(0):'0';
    const d=s.shootingDir[b]||{S:0,'Δ':0,X:0};
    const dt=d.S+d['Δ']+d.X;
    const dirs=dt>0?` [S:${(d.S/dt*100).toFixed(0)}% Δ:${(d['Δ']/dt*100).toFixed(0)}% X:${(d.X/dt*100).toFixed(0)}%]`:'';
    lines.push(`  ${b}: ${s.bunkers[b]} runs (${pct}%), death ${dPct}%${dirs}`);
  });
  return lines.join('\n');
}

function buildMatchSummary(tabId, mk){
  if(!data[tabId]) return 'No data for this match.';
  const md=data[tabId][mk];
  const lines=[`MATCH: ${tabId.replace(/-/g,' ')} ${mk.toUpperCase()} | ${md.t1name||'Top Team'} vs ${md.t2name||'Bottom Team'}`];
  [{tk:'t1pts',name:md.t1name||'Top Team'},{tk:'t2pts',name:md.t2name||'Bottom Team'}].forEach(({tk,name})=>{
    const pts=md[tk]||[];
    let w=0,l=0;
    const bkCounts={};BKS.forEach(b=>bkCounts[b]=0);
    pts.forEach(pt=>{
      if(pt.wl==='W')w++;else if(pt.wl==='L')l++;
      BKS.forEach(b=>{bkCounts[b]+=(pt[b]||[]).length;});
    });
    const top=BKS.filter(b=>bkCounts[b]>0).sort((a,b2)=>bkCounts[b2]-bkCounts[a]).slice(0,6);
    lines.push(`  ${name}: ${w}W-${l}L | Top bunkers: ${top.map(b=>b+'×'+bkCounts[b]).join(', ')}`);
  });
  return lines.join('\n');
}

// ── PDF GENERATION ─────────────────────────────────────────────────
async function generatePdf(){
  const btn=document.getElementById('pdfGenBtn');
  const status=document.getElementById('pdfStatus');
  btn.disabled=true;
  status.textContent='Generating AI analysis...';

  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210, MARGIN=14, CW=W-MARGIN*2;
    let y=18;
    const today=new Date().toLocaleDateString();

    const addPage=()=>{doc.addPage();y=18;};
    const checkY=(need=10)=>{if(y+need>280)addPage();};

    const drawHeader=(title,sub)=>{
      doc.setFillColor(106,27,154);doc.rect(0,0,210,12,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(11);doc.setFont('helvetica','bold');
      doc.text('NXL Scout 2026  |  Tampa Bay Damage',MARGIN,8.5);
      doc.setFontSize(9);doc.text(SESSION+' — '+today,210-MARGIN,8.5,{align:'right'});
      doc.setTextColor(0,0,0);y=18;
      doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text(title,MARGIN,y);y+=6;
      if(sub){doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(90,90,90);doc.text(sub,MARGIN,y);doc.setTextColor(0,0,0);y+=5;}
      y+=2;
    };

    const drawSectionHdr=(txt)=>{
      checkY(10);
      doc.setFillColor(230,210,245);doc.rect(MARGIN,y,CW,6,'F');
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(106,27,154);
      doc.text(txt,MARGIN+2,y+4.2);doc.setTextColor(0,0,0);
      y+=8;
    };

    const drawTable=(headers,rows,colWidths)=>{
      checkY(12);
      const rowH=6, hdrH=7;
      // Header
      doc.setFillColor(213,213,213);doc.rect(MARGIN,y,CW,hdrH,'F');
      doc.setFontSize(8);doc.setFont('helvetica','bold');
      let x=MARGIN;
      headers.forEach((h,i)=>{doc.text(h,x+1,y+4.8);x+=colWidths[i];});
      y+=hdrH;
      // Rows
      rows.forEach((row,ri)=>{
        checkY(rowH+2);
        if(ri%2===1){doc.setFillColor(249,249,249);doc.rect(MARGIN,y,CW,rowH,'F');}
        doc.setFont('helvetica','normal');doc.setFontSize(8);
        x=MARGIN;
        row.forEach((cell,ci)=>{
          const cellStr=String(cell??'');
          doc.text(cellStr,x+1,y+4.2,{maxWidth:colWidths[ci]-2});
          x+=colWidths[ci];
        });
        y+=rowH;
      });
      y+=3;
    };

    const wrapText=(txt,maxW)=>{
      const words=txt.split(' ');const lines=[];let cur='';
      words.forEach(w=>{
        const test=cur?cur+' '+w:w;
        if(doc.getTextWidth(test)>maxW){lines.push(cur);cur=w;}else cur=test;
      });
      if(cur)lines.push(cur);return lines;
    };

    const drawAIBlock=(analysisText)=>{
      drawSectionHdr('AI Analysis');
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      const paras=analysisText.split('\n').filter(p=>p.trim());
      paras.forEach(para=>{
        const wrapped=wrapText(para,CW-4);
        wrapped.forEach(line=>{checkY(5);doc.text(line,MARGIN+2,y);y+=4.5;});
        y+=2;
      });
      y+=3;
    };

    const audience=_pdfAud;

    // ── EVENT SUMMARY ──
    if(_pdfType==='event'){
      const summary=buildEventSummary();
      const sysP=`You are a professional paintball analyst for Tampa Bay Damage. Write a concise event scouting report in plain paragraphs (no markdown). ${audience==='player'?'Write in plain language suitable for players — focus on key takeaways and what to watch for. Keep it brief.':'Include tactical insights, patterns, and recommendations for the coaching staff. Be specific and analytical.'}`;
      const analysis=await callClaude(sysP, summary);

      drawHeader('Full Event Summary Report', SESSION+' — All Scouted Matches');
      drawAIBlock(analysis);

      // Bunker table
      const bkAll={};BKS.forEach(b=>bkAll[b]={runs:0,deaths:0,kills:0,oppRuns:0});
      let totalPts=0;
      TABS.forEach(t=>{
        if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
        ['m1','m2'].forEach(mk=>{
          const md=data[t.id][mk];
          [{tk:'t1pts',oppTk:'t2pts'},{tk:'t2pts',oppTk:'t1pts'}].forEach(({tk,oppTk})=>{
            (md[tk]||[]).forEach((pt,pi)=>{
              const oppPt=(md[oppTk]||[])[pi]||{};
              if(pt.wl||BKS.some(b=>(pt[b]||[]).length>0)) totalPts++;
              BKS.forEach(b=>{
                (pt[b]||[]).forEach(mv=>{if(mv.isDead||(mv.sym&&mv.sym!=='_')){bkAll[b].runs++;} if(mv.isDead)bkAll[b].deaths++;});
                bkAll[b].kills+=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
                bkAll[b].oppRuns+=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
              });
            });
          });
        });
      });
      const allRuns=BKS.reduce((s,b)=>s+bkAll[b].runs,0);
      drawSectionHdr('Bunker Statistics — All Teams');
      if(audience==='coaching'){
        const hdrs=['Bunker','Shape','Runs','Run %','Deaths','Death %','Kills','Kill %'];
        const cw=[20,14,14,14,14,14,14,14];
        const rows=BKS.map((b,i)=>{
          const s=bkAll[b];
          return[b,SHAPES[i]||'',s.runs,allRuns>0?(s.runs/allRuns*100).toFixed(1)+'%':'—',
            s.deaths,s.runs>0?(s.deaths/s.runs*100).toFixed(0)+'%':'—',
            s.kills,s.oppRuns>0?(s.kills/s.oppRuns*100).toFixed(0)+'%':'—'];
        });
        drawTable(hdrs,rows,cw);
      } else {
        const top8=BKS.filter(b=>bkAll[b].runs>0).sort((a,b2)=>bkAll[b2].runs-bkAll[a].runs).slice(0,8);
        const hdrs=['Bunker','Runs','Death %'];
        const cw=[40,40,40];
        drawTable(hdrs,top8.map(b=>[b,bkAll[b].runs,bkAll[b].runs>0?(bkAll[b].deaths/bkAll[b].runs*100).toFixed(0)+'%':'—']),cw);
      }
    }

    // ── MATCH SHEET ──
    else if(_pdfType==='match'){
      const matchVal=(document.getElementById('pdfMatchSel')?.value||'').split('|');
      const tabId=matchVal[0]||'fri-set1', mk=matchVal[1]||'m1';
      const matchSummary=buildMatchSummary(tabId,mk);
      const md=data[tabId]?data[tabId][mk]:null;
      const label=tabId.replace(/-/g,' ').toUpperCase()+' '+mk.toUpperCase();
      const sysP=`You are a paintball analyst for Tampa Bay Damage. Analyze this single match scouting data and write a concise tactical report in plain paragraphs (no markdown). ${audience==='player'?'Focus on key takeaways for players.':'Include coaching-level detail on patterns, vulnerabilities, and strategic recommendations.'}`;
      const analysis=await callClaude(sysP, matchSummary);
      drawHeader('Match Sheet Report', label+' — '+(md?.t1name||'Top')+ ' vs '+(md?.t2name||'Bottom'));
      drawAIBlock(analysis);

      if(md){
        [{tk:'t1pts',name:md.t1name||'Top Team'},{tk:'t2pts',name:md.t2name||'Bottom Team'}].forEach(({tk,name})=>{
          drawSectionHdr(name+' — Point-by-Point');
          const hdrs=['Pt','W/L','R/B','Time',...(audience==='coaching'?BKS.slice(0,10):BKS.slice(0,6))];
          const cwFull=audience==='coaching'?[6,7,7,10,...Array(10).fill(14)]:[6,7,7,10,...Array(6).fill(22)];
          const rows=(md[tk]||[]).map((pt,i)=>{
            const bkVals=(audience==='coaching'?BKS.slice(0,10):BKS.slice(0,6)).map(b=>{
              const mvs=pt[b]||[];
              return mvs.map(mv=>(mv.isDead?'✕':'')+(mv.sym||'')).join('/');
            });
            return[i+1,pt.wl||'',pt.rb||'',pt.time||'',...bkVals];
          }).filter((_,i)=>(md[tk][i]?.wl||BKS.some(b=>(md[tk][i]?.[b]||[]).length>0)));
          if(rows.length) drawTable(hdrs,rows,cwFull);
          else{doc.setFontSize(9);doc.setFont('helvetica','italic');doc.setTextColor(150,150,150);doc.text('No data entered.',MARGIN+2,y);doc.setTextColor(0,0,0);y+=8;}
        });
      }
    }

    // ── TEAM STATS ──
    else if(_pdfType==='team'){
      const team=document.getElementById('pdfTeamSel')?.value||TEAMS[0];
      const teamSum=buildTeamSummary(team);
      const sysP=`You are a paintball analyst for Tampa Bay Damage. Write a team scouting report for ${team} in plain paragraphs (no markdown). ${audience==='player'?'Write for players. Focus on what to watch for and key dangers from this team.':'Write for the coaching staff. Include bunker tendencies, death hotspots, kill opportunities, side preferences, and penalty patterns. Be specific and tactical.'}`;
      const analysis=await callClaude(sysP, teamSum);
      drawHeader('Team Stats Report', team);
      drawAIBlock(analysis);

      drawSectionHdr('Bunker Breakdown');
      const bk={};BKS.forEach(b=>bk[b]={runs:0,deaths:0,kills:0,oppRuns:0});
      TABS.forEach(t=>{
        if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
        ['m1','m2'].forEach(mk=>{
          const md=data[t.id][mk];
          [{tk:'t1pts',name:md.t1name,oppTk:'t2pts'},{tk:'t2pts',name:md.t2name,oppTk:'t1pts'}].forEach(({tk,name,oppTk})=>{
            if(name!==team) return;
            (md[tk]||[]).forEach((pt,pi)=>{
              const oppPt=(md[oppTk]||[])[pi]||{};
              BKS.forEach(b=>{
                (pt[b]||[]).forEach(mv=>{if(mv.isDead||(mv.sym&&mv.sym!=='_'))bk[b].runs++;if(mv.isDead)bk[b].deaths++;});
                bk[b].kills+=(oppPt[b]||[]).filter(mv=>mv.isDead).length;
                bk[b].oppRuns+=(oppPt[b]||[]).filter(mv=>mv.isDead||(mv.sym&&mv.sym!=='_')).length;
              });
            });
          });
        });
      });
      const allRuns=BKS.reduce((s,b)=>s+bk[b].runs,0);
      if(audience==='coaching'){
        drawTable(['Bunker','Shape','Runs','Run %','Deaths','Death %','Kills','Kill %'],
          BKS.map((b,i)=>[b,SHAPES[i]||'',bk[b].runs,allRuns>0?(bk[b].runs/allRuns*100).toFixed(1)+'%':'—',
            bk[b].deaths,bk[b].runs>0?(bk[b].deaths/bk[b].runs*100).toFixed(0)+'%':'—',
            bk[b].kills,bk[b].oppRuns>0?(bk[b].kills/bk[b].oppRuns*100).toFixed(0)+'%':'—']),
          [20,14,14,14,14,14,14,14]);
      } else {
        const active=BKS.filter(b=>bk[b].runs>0).sort((a,b2)=>bk[b2].runs-bk[a].runs).slice(0,8);
        drawTable(['Bunker','Runs','Death %'],active.map(b=>[b,bk[b].runs,bk[b].runs>0?(bk[b].deaths/bk[b].runs*100).toFixed(0)+'%':'—']),[40,40,40]);
      }
    }

    // ── PLAYER STATS ──
    else if(_pdfType==='player'){
      const team=document.getElementById('pdfPTeamSel')?.value||TEAMS[0];
      const playerLabel=document.getElementById('pdfPPlayerSel')?.value||'';
      const playerSum=buildPlayerSummary(team, playerLabel);
      const sysP=`You are a paintball analyst. Write a player scouting report in plain paragraphs (no markdown). ${audience==='player'?'Write directly to the player. Be encouraging but honest. Highlight their tendencies, risks, and how to improve.':'Write for the coaching staff. Analyze this player\'s role, tendencies, death patterns, shooting direction habits, and tactical value.'}`;
      const analysis=await callClaude(sysP, playerSum);
      drawHeader('Player Stats Report', playerLabel+' — '+team);
      const s=calcPlayerStats(team, playerLabel);
      const pp=s.pointsPlayed;

      // Summary cards in PDF
      checkY(20);
      doc.setFillColor(245,245,245);doc.rect(MARGIN,y,CW,14,'F');
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(80,80,80);
      const cards=[['Points Played',pp],['Deaths Off Break',s.pointsDied+' ('+(pp>0?(s.pointsDied/pp*100).toFixed(0):0)+'%)'],['Major Pen',s.penalties.Mj],['Minor Pen',s.penalties.Mi]];
      cards.forEach((c,i)=>{
        const cx=MARGIN+(CW/4)*i;
        doc.text(c[0],cx+2,y+5);
        doc.setFontSize(12);doc.setTextColor(26,110,26);doc.text(String(c[1]),cx+2,y+11);
        doc.setFontSize(8);doc.setTextColor(80,80,80);
      });
      doc.setTextColor(0,0,0);y+=18;

      drawAIBlock(analysis);
      drawSectionHdr('Bunker Breakdown');
      const totalCount=BKS.reduce((sum,b)=>sum+(s.bunkers[b]||0),0);
      if(audience==='coaching'){
        drawTable(['Bunker','Count','Count %','Death %','Snake %','Dorito %','Dove %'],
          BKS.map(b=>{
            const cnt=s.bunkers[b]||0;const d=s.shootingDir[b]||{S:0,'Δ':0,X:0};const dt=d.S+d['Δ']+d.X;
            return[b,cnt,totalCount>0?(cnt/totalCount*100).toFixed(1)+'%':'—',
              cnt>0?((s.deaths[b]||0)/cnt*100).toFixed(0)+'%':'—',
              dt>0?(d.S/dt*100).toFixed(0)+'%':'—',dt>0?(d['Δ']/dt*100).toFixed(0)+'%':'—',dt>0?(d.X/dt*100).toFixed(0)+'%':'—'];
          }),[20,14,16,16,18,18,18]);
      } else {
        const active=BKS.filter(b=>s.bunkers[b]>0).sort((a,b2)=>(s.bunkers[b2]||0)-(s.bunkers[a]||0)).slice(0,8);
        drawTable(['Bunker','Count','Death %'],active.map(b=>{const cnt=s.bunkers[b]||0;return[b,cnt,cnt>0?((s.deaths[b]||0)/cnt*100).toFixed(0)+'%':'—'];}),[40,40,40]);
      }
    }

    // Footer on last page
    const pageCount=doc.internal.getNumberOfPages();
    for(let i=1;i<=pageCount;i++){
      doc.setPage(i);
      doc.setFontSize(8);doc.setTextColor(150,150,150);
      doc.text('NXL Scout 2026 — Tampa Bay Damage | Page '+i+' of '+pageCount,W/2,290,{align:'center'});
    }

    const filename=`NXLScout_${_pdfType}_${SESSION}_${today.replace(/\//g,'-')}.pdf`;
    doc.save(filename);
    status.textContent='✅ PDF saved: '+filename;
  } catch(err){
    console.error(err);
    status.textContent='❌ Error: '+err.message;
  }
  btn.disabled=false;
}

// ── AI CHAT PANEL ─────────────────────────────────────────────────
function openChatPanel(){document.getElementById('chatPanel').classList.add('open');}
function closeChatPanel(){document.getElementById('chatPanel').classList.remove('open');}

async function sendChat(){
  const input=document.getElementById('chatInput');
  const msgs=document.getElementById('chatMsgs');
  const q=input.value.trim();if(!q)return;
  input.value='';

  const uMsg=document.createElement('div');uMsg.className='chat-msg user';uMsg.textContent=q;msgs.appendChild(uMsg);

  const thinking=document.createElement('div');thinking.className='chat-msg thinking';thinking.textContent='Analyzing scouting data...';msgs.appendChild(thinking);
  msgs.scrollTop=msgs.scrollHeight;

  try{
    const context=buildEventSummary();
    const sysP=`You are an NXL paintball scouting analyst for Tampa Bay Damage. You have access to live event scouting data. Answer questions concisely and tactically. Use the data provided. If the data doesn't contain enough information to answer, say so clearly. Never use markdown formatting — respond in plain text only.`;
    const userPrompt=`Current scouting data:\n${context}\n\nQuestion: ${q}`;
    const reply=await callClaude(sysP, userPrompt);
    thinking.className='chat-msg ai';thinking.textContent=reply;
  } catch(err){
    thinking.className='chat-msg ai';thinking.textContent='Error: '+err.message;
  }
  msgs.scrollTop=msgs.scrollHeight;
}

// expose calcPlayerStats globally for PDF use
function calcPlayerStats(team, playerLabel){
  const stats={pointsPlayed:0,pointsDied:0,penalties:{Mi:0,Mj:0},bunkers:{},deaths:{},shootingDir:{}};
  BKS.forEach(b=>{stats.bunkers[b]=0;stats.deaths[b]=0;stats.shootingDir[b]={S:0,'\u2206':0,X:0};});
  TABS.forEach(t=>{
    if(t.id==='stats'||t.id==='rosters'||!data[t.id]) return;
    ['m1','m2'].forEach(mk=>{
      const md=data[t.id][mk];
      ['t1pts','t2pts'].forEach((tk,ti)=>{
        const tname=ti===0?md.t1name:md.t2name;
        if(tname!==team) return;
        (md[tk]||[]).forEach(pt=>{
          let appeared=false,died=false;
          BKS.forEach(b=>{
            (pt[b]||[]).forEach(mv=>{
              const mvLabel=mv.player&&mv.player.label?mv.player.label:(mv.player||null);
              if(mvLabel!==playerLabel) return;
              appeared=true;stats.bunkers[b]++;
              if(mv.isDead){died=true;stats.deaths[b]++;}
              if(mv.pen==='Mi')stats.penalties.Mi++;if(mv.pen==='Mj')stats.penalties.Mj++;
              const sym=mv.sym||'';
              if(sym.startsWith('S'))stats.shootingDir[b].S++;
              else if(sym.startsWith('\u2206'))stats.shootingDir[b]['\u2206']++;
              else if(sym.startsWith('X'))stats.shootingDir[b].X++;
            });
          });
          if(appeared){stats.pointsPlayed++;if(died)stats.pointsDied++;}
        });
      });
    });
  });
  return stats;
}
